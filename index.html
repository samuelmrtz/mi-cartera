<style>
@font-face { font-family: "Geist"; font-weight: 400; font-display: swap; src: url(fonts/geist-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Geist"; font-weight: 500; font-display: swap; src: url(fonts/geist-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "Geist"; font-weight: 600; font-display: swap; src: url(fonts/geist-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Geist"; font-weight: 700; font-display: swap; src: url(fonts/geist-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: "Geist Mono"; font-weight: 400; font-display: swap; src: url(fonts/geist-mono-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Geist Mono"; font-weight: 500; font-display: swap; src: url(fonts/geist-mono-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "Geist Mono"; font-weight: 600; font-display: swap; src: url(fonts/geist-mono-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Instrument Serif"; font-weight: 400; font-display: swap; src: url(fonts/instrument-serif-latin-400-normal.woff2) format("woff2"); }
/* App instalada: sin rebote del navegador ni selección accidental al tocar */
html, body { overscroll-behavior-y: none; }
.bnav, .side, .btn, .chip { -webkit-user-select: none; user-select: none; }
</style>
<style>
/* Layout: app de una columna en el celular (barra inferior + botón +), barra lateral y dos columnas en la computadora */
:root {
  --bg: #f2f4f8;
  --surface: #ffffff;
  --surface-2: #e9edf4;
  --ink: #111726;
  --ink-2: #485267;
  --muted: #747e93;
  --line: #dce1ea;
  --accent: #2847d4;
  --accent-ink: #ffffff;
  --accent-soft: #e2e7fb;
  --pos: #11784a;
  --neg: #c0372f;
  --warn: #a8670e;
  --warn-soft: #fbefdc;
  --neg-soft: #fbe5e3;
  --pos-soft: #ddf3e8;
  --scrim: rgba(17, 23, 38, .42);
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
  --c5: #e87ba4; --c6: #008300; --c7: #4a3aa7; --c8: #e34948;
  --f-display: "Instrument Serif", Georgia, "Times New Roman", serif;
  --f-ui: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1119; --surface: #151b26; --surface-2: #1e2533; --ink: #edf0f6; --ink-2: #b2bacb;
    --muted: #7f889e; --line: #283041; --accent: #8197ff; --accent-ink: #0d1119; --accent-soft: #212b4b;
    --pos: #4cc387; --neg: #ff7b70; --warn: #e6a94a; --warn-soft: #33281a; --neg-soft: #3a1f1f; --pos-soft: #17322a;
    --scrim: rgba(0, 0, 0, .6);
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #1f9a1f; --c7: #9085e9; --c8: #e66767;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1119; --surface: #151b26; --surface-2: #1e2533; --ink: #edf0f6; --ink-2: #b2bacb;
  --muted: #7f889e; --line: #283041; --accent: #8197ff; --accent-ink: #0d1119; --accent-soft: #212b4b;
  --pos: #4cc387; --neg: #ff7b70; --warn: #e6a94a; --warn-soft: #33281a; --neg-soft: #3a1f1f; --pos-soft: #17322a;
  --scrim: rgba(0, 0, 0, .6);
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #1f9a1f; --c7: #9085e9; --c8: #e66767;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font: 15px/1.45 var(--f-ui); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
/* En celular el formulario se muestra como página normal (sin capa fija ni bloqueo de scroll),
   porque dentro del visor de Claude una capa fija desfasaba los toques respecto a lo que se ve. */
body.pagemode #main, body.pagemode .bnav, body.pagemode .side { display: none !important; }
body.pagemode .app { display: block; }
/* Mientras se escribe en un campo de texto en el celular, se agrega espacio abajo para poder subir ese campo
   a la parte alta de la pantalla: así el teclado no lo tapa y el navegador no desplaza el visor de Claude
   (ese desplazamiento es el que desfasaba los toques al cerrar el teclado). */
body.pagemode.kbd .sheet { padding-bottom: 85vh; }
body.pagemode .scrim { position: static; background: none; display: block; }
body.pagemode .sheet { max-width: 640px; margin: 0 auto; max-height: none; overflow: visible; border-radius: 0; background: var(--bg); padding: 16px 16px calc(32px + env(safe-area-inset-bottom, 0px)); animation: none !important; }
.chip:active, .seg button:active, .sw:active { transform: scale(.96); }
@media (pointer: coarse) { .chip { min-height: 42px; padding: 9px 14px; } .seg button { min-height: 38px; } .sw { width: 36px; height: 36px; } .chips { gap: 10px; } }
.chip[aria-pressed="true"] { font-weight: 600; box-shadow: inset 0 0 0 1px var(--accent); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.pos { color: var(--pos); } .neg { color: var(--neg); } .muted { color: var(--muted); }

.app { display: grid; min-height: 100%; }
.main { padding-inline: 16px; padding-block: 20px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom, 0px)); width: 100%; max-width: 1120px; margin: 0 auto; min-width: 0; }
.side { display: none; }

/* Navegación inferior (celular) */
.bnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; }
.bnav button { background: none; border: 0; display: grid; justify-items: center; gap: 2px; padding: 6px 0; font-size: 11px; color: var(--muted); font-weight: 500; }
.bnav button svg { width: 22px; height: 22px; }
.bnav button[aria-current="page"] { color: var(--accent); }
.bnav .add { justify-self: center; width: 52px; height: 52px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; margin-top: -22px; box-shadow: 0 6px 18px rgba(40, 71, 212, .35); }
.bnav .add svg { width: 26px; height: 26px; }

@media (min-width: 960px) {
  .app { grid-template-columns: 232px 1fr; }
  .bnav { display: none; }
  .side { display: flex; flex-direction: column; gap: 4px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; padding: 24px 16px; border-right: 1px solid var(--line); background: var(--surface); }
  .side .brand { font-family: var(--f-display); font-size: 30px; line-height: 1; padding: 0 10px 20px; }
  .side button.nav { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 10px; border-radius: 10px; color: var(--ink-2); font-weight: 500; text-align: left; }
  .side button.nav svg { width: 20px; height: 20px; }
  .side button.nav:hover { background: var(--surface-2); }
  .side button.nav[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
  .side .btn { margin-top: 14px; }
  .main { padding-block: 32px 48px; padding-inline: 32px; }
}

/* Encabezados y tipografía */
.ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.ph h1 { font-family: var(--f-display); font-weight: 400; font-size: 34px; line-height: 1.05; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.ph .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
h2.sec { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
h2.sec button { text-transform: none; letter-spacing: 0; }

.grid { display: grid; gap: 16px; }
@media (min-width: 960px) { .grid.two { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; } }
.col { display: grid; gap: 16px; min-width: 0; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }

/* Hero de saldo */
.hero { background: var(--ink); color: var(--bg); border-radius: 18px; padding: 20px; display: grid; gap: 14px; }
.hero .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; opacity: .7; font-weight: 600; }
.hero .big { font-family: var(--f-display); font-size: clamp(42px, 11vw, 60px); line-height: 1; letter-spacing: -.01em; overflow-wrap: anywhere; }
.hero .big .cents { font-size: .5em; opacity: .65; }
.hero .row { display: flex; gap: 24px; flex-wrap: wrap; font-size: 13px; }
.hero .row div { display: grid; gap: 2px; }
.hero .row span:first-child { opacity: .65; }
.hero .row .num { font-size: 15px; font-weight: 500; }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 600; margin-top: 2px; overflow-wrap: anywhere; }
.stat .x { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

/* Listas */
.list { display: grid; }
.li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; padding-top: 2px; }
.li.btnrow { background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; padding-inline: 0; }
.li.btnrow:hover .t { color: var(--accent); }
.li .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .s { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .r { text-align: right; display: grid; gap: 2px; justify-items: end; }
.li .amt { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; flex: none; }
.ico.acc { background: var(--surface-2); color: var(--ink-2); }
.ico.acc svg { width: 18px; height: 18px; }
.day { font-size: 12px; font-weight: 600; color: var(--muted); padding: 14px 0 4px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); }
.day:first-child { padding-top: 0; }

.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.neg { background: var(--neg-soft); color: var(--neg); }
.pill.pos { background: var(--pos-soft); color: var(--pos); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }

/* Botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 9px 14px; border-radius: 10px; font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--muted); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { filter: brightness(1.07); }
.btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn.danger { color: var(--neg); }
.btn.danger.on { background: var(--neg); border-color: var(--neg); color: #fff; }
.btn svg { width: 16px; height: 16px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* Cuentas */
.accs { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.acard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.acard .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.acard .name { font-weight: 600; font-size: 16px; }
.acard .bal { font-family: var(--f-display); font-size: 34px; line-height: 1; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.meter { height: 6px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }

/* Periodo y filtros */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 13px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.stepper button svg { width: 16px; height: 16px; }
.stepper span { min-width: 140px; text-align: center; font-weight: 600; font-size: 14px; }
select.inp { width: auto; }

/* Barras por categoría */
.cbars { display: grid; gap: 10px; }
.cbar { display: grid; gap: 4px; }
.cbar .h { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; }
.cbar .h .n { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cbar .h .a { font-family: var(--f-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cbar .h .a small { color: var(--muted); margin-left: 6px; }
.cbar .track { height: 8px; background: var(--surface-2); border-radius: 4px; }
.cbar .track i { display: block; height: 100%; border-radius: 4px; }

/* Gráfica diaria */
.daily { position: relative; }
.daily svg { width: 100%; height: 150px; display: block; overflow: visible; }
.daily .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -100%); }

/* Formularios / hojas */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 92vh; max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; border-radius: 20px 20px 0 0;
  padding: 18px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; }
@media (min-width: 640px) { .scrim { align-items: center; } .sheet { border-radius: 20px; padding: 22px; } }
.sheet .sh { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sheet .sh h3 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 26px; }
.x { width: 34px; height: 34px; border-radius: 10px; border: 0; background: var(--surface-2); display: grid; place-items: center; }
.x svg { width: 18px; height: 18px; }
.fld { display: grid; gap: 6px; }
.fld > label, .fld > .lab { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.fld .hint { font-size: 12.5px; color: var(--muted); }
.inp { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 16px; }
.inp:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.amount { display: flex; align-items: baseline; gap: 6px; border-bottom: 2px solid var(--line); padding-bottom: 4px; }
.amount:focus-within { border-color: var(--accent); }
.amount span { font-family: var(--f-display); font-size: 36px; color: var(--muted); }
.amount output { font-family: var(--f-display); font-size: 52px; line-height: 1.1; min-width: 0; overflow-wrap: anywhere; }
.amount output.ph { color: var(--muted); }
.kp { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kp button { height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font: 600 21px/1 var(--f-num); color: var(--ink); display: grid; place-items: center; }
.kp button.fn { background: var(--surface-2); color: var(--ink-2); }
.kp button svg { width: 22px; height: 22px; }
.kp button:active { background: var(--accent-soft); transform: scale(.97); }
.amount input { border: 0; background: none; font-family: var(--f-display); font-size: 48px; width: 100%; padding: 0; outline: none; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); padding: 7px 12px; border-radius: 99px; font-size: 14px; font-weight: 500; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.chip.add { border-style: dashed; color: var(--muted); }
.chip .dot { width: 9px; height: 9px; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.inline-new { display: flex; gap: 8px; }
.inline-new .inp { flex: 1; min-width: 0; }
.err { color: var(--neg); font-size: 13px; font-weight: 500; }
.sheet .foot { display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; }
.sheet .foot .btn.pri { flex: 1; padding: 13px; font-size: 15px; }
.check { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }

.empty { text-align: center; color: var(--muted); padding: 24px 8px; font-size: 14px; display: grid; gap: 10px; justify-items: center; }
.onb { max-width: 520px; margin: 8vh auto 0; display: grid; gap: 18px; }
.onb h1 { font-family: var(--f-display); font-weight: 400; font-size: 46px; line-height: 1; margin: 0; }
.onb p { margin: 0; color: var(--ink-2); }
.onb ul { margin: 0; padding-left: 18px; color: var(--ink-2); display: grid; gap: 4px; }

.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 500; z-index: 60; max-width: calc(100% - 32px); }
@media (min-width: 960px) { .toast { bottom: 28px; } }
.sumrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
@media (max-width: 420px) { .stats, .sumrow { grid-template-columns: 1fr 1fr; } .stats .stat:last-child, .sumrow .stat:last-child { grid-column: 1 / -1; } }
@media (prefers-reduced-motion: no-preference) { .sheet.enter { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(16px); opacity: .6; } } }
.rt { display: grid; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
.rt:first-child { border-top: 0; padding-top: 2px; }

@media (min-width: 560px) { .pie-wrap { grid-template-columns: 200px minmax(0, 1fr); } }

.pie .ctr { position: absolute; inset: 22%; display: grid; place-content: center; text-align: center; pointer-events: none; gap: 2px; }
.pie .ctr .k { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 110px; }
.pie .ctr .v { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; }
.pie .ctr .p { font-size: 11.5px; color: var(--muted); }
.leg { display: grid; gap: 2px; min-width: 0; }
.leg button { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 10px; align-items: center; background: none; border: 0; padding: 7px 6px; border-radius: 8px; text-align: left; font-size: 13.5px; }
.leg button:hover, .leg button.on { background: var(--surface-2); }
.leg .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.leg .pc { font-size: 12px; color: var(--muted); min-width: 34px; text-align: right; }
details.more summary { cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 600; padding: 6px 0; }
</style>

<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main" id="main">
    <div class="empty" style="margin-top:20vh">Cargando tus datos…</div>
  </main>
  <nav class="bnav" id="bnav" hidden></nav>
</div>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>
(() => {
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' });
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const money = n => fmt.format(r2(n));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());
const curMonth = () => today().slice(0, 7);
const addMonths = (mk, n) => { const [y, m] = mk.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const daysIn = (y, m0) => new Date(y, m0 + 1, 0).getDate();
const dateInMonth = (mk, day) => { const [y, m] = mk.split('-').map(Number); return new Date(y, m - 1, Math.min(day, daysIn(y, m - 1))); };
const diffDays = (a, b) => Math.round((pd(ymd(a)) - pd(ymd(b))) / 86400000);
const gen = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const parseAmt = v => { const n = parseFloat(String(v ?? '').replace(/[$,\s]/g, '')); return isFinite(n) ? n : NaN; };
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const MESES_L = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const DIAS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const DIAS_L = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const shortDate = s => { const d = pd(s); return `${d.getDate()} ${MESES[d.getMonth()]}`; };
const dayLabel = s => { const t = today(); if (s === t) return 'Hoy'; if (s === ymd(new Date(Date.now() - 864e5))) return 'Ayer'; const d = pd(s); return `${DIAS_L[d.getDay()]} ${d.getDate()} de ${MESES_L[d.getMonth()]}`; };
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

const ICON = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>',
  repeat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M8 14h3"/></svg>',
  wallet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2z"/><path d="M16 14.5h.01"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>',
  right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
  cash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>',
  card: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19M6.5 15h4"/></svg>',
  invest: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>',
};
const ACC_T = { efectivo: 'Efectivo', debito: 'Débito', credito: 'Crédito', inversion: 'Inversión / SOFIPO' };
const accIcon = t => t === 'efectivo' ? ICON.cash : t === 'inversion' ? ICON.invest : ICON.card;
const earns = a => !!a && (a.type === 'inversion' || (a.type === 'debito' && !!a.earns));
const autoY = a => earns(a) && a.autoYield !== false && !a.deleted;
const addDays = (ds, n) => { const d = pd(ds); d.setDate(d.getDate() + n); return ymd(d); };

/* ---------- estado ---------- */
const S = { pie: { kind: 'gasto', mode: 'mes', anchor: today(), focus: null }, rcount: {}, status: 'loading', cfg: null, months: {}, movs: [], tab: 'inicio', per: { mode: 'mes', anchor: today() }, fAcc: 'all', sheet: null };
let db = null, col = null, uid = null, downloads = null;
const queues = {};
const enqueue = (k, fn) => { const p = (queues[k] || Promise.resolve()).then(fn, fn); queues[k] = p.catch(() => {}); return p; };

const live = obj => Object.entries(obj || {}).filter(([, v]) => v && !v.deleted).map(([id, v]) => ({ id, ...v }));
const accounts = () => live(S.cfg?.accounts).sort((a, b) => (a.order || 0) - (b.order || 0) || String(a.name).localeCompare(b.name));
const categories = kind => live(S.cfg?.categories).filter(c => !kind || c.kind === kind).sort((a, b) => (a.order || 0) - (b.order || 0));
const subs = () => live(S.cfg?.subs);
const routines = () => live(S.cfg?.routines).sort((a, b) => String(a.created || '').localeCompare(String(b.created || '')));
const DOW = [[1, 'L'], [2, 'M'], [3, 'Mi'], [4, 'J'], [5, 'V'], [6, 'S'], [0, 'D']];
const DOW_N = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const accById = id => S.cfg?.accounts?.[id];
const catById = id => S.cfg?.categories?.[id];

function rebuild() {
  const out = [];
  for (const [mk, items] of Object.entries(S.months)) for (const [id, m] of Object.entries(items || {})) if (m && m.date) out.push({ id, mk, ...m });
  out.sort((a, b) => b.date.localeCompare(a.date) || (b.ts || 0) - (a.ts || 0));
  S.movs = out;
}

/* ---------- cálculos ---------- */
function balances() {
  const bal = {};
  for (const a of live(S.cfg?.accounts)) bal[a.id] = Number(a.initial) || 0;
  for (const m of S.movs) {
    const amt = Number(m.amount) || 0;
    if (m.type === 'gasto') bal[m.accountId] = (bal[m.accountId] || 0) - amt;
    else if (m.type === 'ingreso') bal[m.accountId] = (bal[m.accountId] || 0) + amt;
    else if (m.type === 'transfer') { bal[m.accountId] = (bal[m.accountId] || 0) - amt; bal[m.toAccountId] = (bal[m.toAccountId] || 0) + amt; }
    else if (m.type === 'ajuste') bal[m.accountId] = (bal[m.accountId] || 0) + amt;
  }
  return bal;
}
function yieldOf(a, bal) {
  const b = Math.max(0, bal || 0), rate = Number(a.rate) || 0, capv = Number(a.cap) || 0, over = Number(a.rateOver) || 0, isr = Number(a.isr) || 0;
  const grossYear = capv > 0 ? (Math.min(b, capv) * rate + Math.max(0, b - capv) * over) / 100 : b * rate / 100;
  const isrYear = b * isr / 100;
  const netDay = (grossYear - isrYear) / 365;
  return { grossDay: grossYear / 365, isrDay: isrYear / 365, netDay, netMonth: netDay * 30.4, netYear: grossYear - isrYear, effRate: b ? (grossYear / b) * 100 : rate };
}
function periodRange(p) {
  const d = pd(p.anchor);
  if (p.mode === 'dia') return { from: p.anchor, to: p.anchor };
  if (p.mode === 'semana') { const dow = (d.getDay() + 6) % 7; const s = new Date(d); s.setDate(d.getDate() - dow); const e = new Date(s); e.setDate(s.getDate() + 6); return { from: ymd(s), to: ymd(e) }; }
  if (p.mode === 'año') return { from: `${d.getFullYear()}-01-01`, to: `${d.getFullYear()}-12-31` };
  const s = new Date(d.getFullYear(), d.getMonth(), 1), e = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  return { from: ymd(s), to: ymd(e) };
}
function periodLabel(p) {
  const r = periodRange(p), d = pd(p.anchor);
  if (p.mode === 'dia') return cap1(dayLabel(p.anchor));
  if (p.mode === 'semana') return `${shortDate(r.from)} – ${shortDate(r.to)}`;
  if (p.mode === 'año') return String(d.getFullYear());
  return `${cap1(MESES_L[d.getMonth()])} ${d.getFullYear()}`;
}
function shiftPeriod(p, n) {
  const d = pd(p.anchor);
  if (p.mode === 'dia') d.setDate(d.getDate() + n);
  else if (p.mode === 'semana') d.setDate(d.getDate() + 7 * n);
  else if (p.mode === 'año') { d.setDate(1); d.setMonth(0); d.setFullYear(d.getFullYear() + n); }
  else { d.setDate(1); d.setMonth(d.getMonth() + n); }
  return { ...p, anchor: ymd(d) };
}
const inRange = (m, r) => m.date >= r.from && m.date <= r.to;
function sums(list) { let g = 0, i = 0; for (const m of list) { if (m.type === 'gasto') g += +m.amount || 0; else if (m.type === 'ingreso') i += +m.amount || 0; } return { g, i }; }
function byCategory(list, kind = 'gasto') {
  const t = {};
  for (const m of list) if (m.type === kind) t[m.categoryId || '_'] = (t[m.categoryId || '_'] || 0) + (+m.amount || 0);
  return Object.entries(t).map(([id, v]) => ({ id, v, c: catById(id) })).sort((a, b) => b.v - a.v);
}
function subDue(s) {
  const dueMonth = s.lastPaid ? addMonths(s.lastPaid, 1) : curMonth();
  const due = dateInMonth(dueMonth, Number(s.day) || 1);
  return { dueMonth, due, days: diffDays(due, new Date()) };
}
function dueBadge(days) {
  if (days < 0) return `<span class="pill neg">Vencido hace ${-days} d</span>`;
  if (days === 0) return `<span class="pill warn">Vence hoy</span>`;
  if (days <= 5) return `<span class="pill warn">En ${days} d</span>`;
  return `<span class="pill">En ${days} d</span>`;
}
function nextDayOf(day) { const t = new Date(); let d = new Date(t.getFullYear(), t.getMonth(), Math.min(day, daysIn(t.getFullYear(), t.getMonth()))); if (diffDays(d, t) < 0) d = dateInMonth(addMonths(curMonth(), 1), day); return d; }

function routinePending() {
  const t = new Date(), out = [];
  for (const r of routines().filter(r => r.active !== false)) {
    for (let k = 6; k >= 0; k--) {
      const d = new Date(t.getFullYear(), t.getMonth(), t.getDate() - k), ds = ymd(d);
      if (r.created && ds < r.created) continue;
      if (!(r.days || []).includes(d.getDay())) continue;
      out.push({ r, ds, done: S.movs.some(m => m.routineId === r.id && m.date === ds), skip: (r.skipped || []).includes(ds) });
    }
  }
  return out;
}
function routineWeek(r, wk) {
  let n = 0; for (let d = pd(wk.from); ymd(d) <= wk.to; d.setDate(d.getDate() + 1)) if ((r.days || []).includes(d.getDay())) n++;
  const exp = n * (+r.times || 1) * (+r.amount || 0);
  const got = S.movs.filter(m => m.routineId === r.id && inRange(m, wk)).reduce((a, m) => a + (+m.amount || 0), 0);
  return { exp, got };
}
const daysText = days => DOW.filter(([d]) => (days || []).includes(d)).map(([, l]) => l).join(' ');
function routinesCard() {
  const rs = routines().filter(r => r.active !== false); if (!rs.length) return '';
  const t = today(), items = routinePending(), pend = items.filter(i => !i.done && !i.skip);
  const doneToday = items.filter(i => i.ds === t && i.done);
  const wk = periodRange({ mode: 'semana', anchor: t });
  const row = ({ r, ds }) => {
    const k = r.id + '|' + ds, c = S.rcount[k] ?? (+r.times || 1), tot = r2(c * (+r.amount || 0)), inc = r.type === 'ingreso';
    const when = ds === t ? 'Hoy' : ds === ymd(new Date(Date.now() - 864e5)) ? 'Ayer' : `${cap1(DOW_N[pd(ds).getDay()])} ${pd(ds).getDate()}`;
    return `<div class="rt"><div class="rt-h"><div style="min-width:0"><div class="t">${esc(r.name)}</div><div class="s muted" style="font-size:12.5px">${when} · ${esc(accById(r.accountId)?.name || '')}</div></div><span class="amt ${inc ? 'pos' : ''}">${inc ? '+' : '−'}${money(tot)}</span></div>
      <div class="rt-a"><div class="cnt"><button data-act="rc-dec" data-id="${r.id}" data-d="${ds}" aria-label="Menos">−</button><span class="num">${c} × ${money(r.amount)}</span><button data-act="rc-inc" data-id="${r.id}" data-d="${ds}" aria-label="Más">+</button></div>
      <button class="btn sm" data-act="r-skip" data-id="${r.id}" data-d="${ds}">${ds === t ? 'Hoy no' : 'No hubo'}</button><button class="btn pri sm" data-act="r-log" data-id="${r.id}" data-d="${ds}">Registrar</button></div></div>`;
  };
  const week = rs.map(r => ({ r, ...routineWeek(r, wk) })).filter(x => x.exp || x.got);
  return `<section class="panel"><h2 class="sec">Rutinas por confirmar <button class="btn ghost sm" data-act="go-routines">Configurar</button></h2>
    ${pend.length ? pend.map(row).join('') : `<div class="muted" style="font-size:14px">${doneToday.length ? 'Todo lo de hoy está registrado.' : 'Nada pendiente por hoy.'}</div>`}
    ${week.length ? `<div class="wk"><div class="muted" style="font-weight:600">Esta semana</div>${week.map(x => `<div><span>${esc(x.r.name)}</span><span>${money(x.got)} de ${money(x.exp)}</span></div>`).join('')}</div>` : ''}
  </section>`;
}

/* Interés compuesto: cada día se abona el rendimiento neto del saldo con que cerró el día anterior.
   Un abono por día con id fijo (y-<cuenta>-<fecha>), así dos dispositivos escriben lo mismo. */
let accruing = false, accrueTried = '';
function yieldCat() { const c = S.cfg.categories || {}; if (c['c-rend']) return 'c-rend'; const f = categories('ingreso').find(x => /rendim/i.test(x.name)); return f ? f.id : 'c-rend'; }
function pendingYield() {
  const t = today(), out = {}, catId = yieldCat();
  for (const a of live(S.cfg?.accounts).filter(autoY)) {
    const start = a.yieldStart || a.created || t;
    let first = addDays(start, 1);
    const minDay = addDays(t, -400); if (first < minDay) first = minDay;
    if (first > t) continue;
    const mine = S.movs.filter(m => m.accountId === a.id || m.toAccountId === a.id);
    const has = new Set(mine.filter(m => m.auto === 'yield').map(m => m.date));
    const missing = []; for (let d = first; d <= t; d = addDays(d, 1)) if (!has.has(d)) missing.push(d);
    if (!missing.length) continue;
    const delta = m => m.type === 'gasto' ? -m.amount : m.type === 'ingreso' ? +m.amount : m.type === 'ajuste' ? +m.amount : m.type === 'transfer' ? (m.toAccountId === a.id ? +m.amount : -m.amount) : 0;
    const added = {};
    for (const c of missing) {
      const base = addDays(c, -1);
      let bal = Number(a.initial) || 0;
      for (const m of mine) if (m.date <= base) bal += delta(m) || 0;
      for (const [d, v] of Object.entries(added)) if (d <= base) bal += v;
      const amt = r2(yieldOf(a, bal).netDay);
      if (amt <= 0) continue;
      added[c] = amt;
      const mk = c.slice(0, 7);
      (out[mk] = out[mk] || {})[`y-${a.id}-${c}`] = { date: c, amount: amt, type: 'ingreso', accountId: a.id, categoryId: catId, note: 'Rendimiento diario', auto: 'yield', ts: pd(c).getTime() };
    }
  }
  return out;
}
async function accrue() {
  if (accruing || S.status !== 'ready' || accrueTried === today()) return;
  const out = pendingYield(); if (!Object.keys(out).length) return;
  accruing = true; accrueTried = today();
  try {
    if (!(S.cfg.categories || {})['c-rend'] && yieldCat() === 'c-rend') await writeCfg({ categories: { 'c-rend': { name: 'Rendimientos', kind: 'ingreso', color: 4, order: 11 } } });
    for (const [mk, items] of Object.entries(out)) await writeItems(mk, items);
  } finally { accruing = false; }
}
async function writeItems(mk, items) {
  const ref = col.doc('m-' + mk);
  try {
    await enqueue('m-' + mk, async () => {
      if (S.months[mk] !== undefined) return ref.update({ items });
      try { await ref.update({ items }); } catch (e) { if (e && e.code === 'invalid_argument') await ref.set({ items }); else throw e; }
    });
    return true;
  } catch (e) { return false; }
}

/* ---------- escritura ---------- */
const cfgRef = () => col.doc('config');
async function writeCfg(patch) {
  try { await enqueue('config', () => cfgRef().update(patch)); return true; }
  catch (e) { toast(errMsg(e)); return false; }
}
async function writeMov(mk, id, value) {
  const ref = col.doc('m-' + mk);
  try {
    await enqueue('m-' + mk, async () => {
      if (S.months[mk] !== undefined) return ref.update({ items: { [id]: value } });
      try { await ref.update({ items: { [id]: value } }); }
      catch (e) { if (e && e.code === 'invalid_argument' && value) await ref.set({ items: { [id]: value } }); else throw e; }
    });
    return true;
  } catch (e) { toast(errMsg(e)); return false; }
}
function errMsg(e) {
  const c = e && e.code;
  if (c === 'quota_exceeded') return 'Se llenó el espacio de datos. Exporta un respaldo y borra movimientos antiguos.';
  if (c === 'resource_exhausted') return 'Demasiados cambios seguidos. Espera unos segundos e intenta de nuevo.';
  if (c === 'unavailable') return 'Sin conexión con el servidor. Intenta de nuevo en un momento.';
  return 'No se pudo guardar: ' + (e && e.message || 'error desconocido');
}

/* ---------- render principal ---------- */

function piePanel() {

  if (cats.length > 8) { const rest = cats.slice(7); cats = cats.slice(0, 7).concat([{ id: '_otras', v: rest.reduce((a, c) => a + c.v, 0), c: { name: `Otras (${rest.length})` }, other: true }]); }
  const tot = cats.reduce((a, c) => a + c.v, 0);
  const col = c => c.other ? 'var(--muted)' : catColor(c.id);
  let svg = '';
  if (tot > 0) {
    const R = 50, ri = 31, cx = 50, cy = 50;
    if (cats.length === 1) svg = `<circle data-i="0" cx="50" cy="50" r="${(R + ri) / 2}" fill="none" stroke="${col(cats[0])}" stroke-width="${R - ri}"/>`;
    else {
      let a0 = -Math.PI / 2;
      svg = cats.map((c, i) => {
        const a1 = a0 + (c.v / tot) * Math.PI * 2, big = a1 - a0 > Math.PI ? 1 : 0;
        const pt = (rad, a) => `${(cx + rad * Math.cos(a)).toFixed(3)} ${(cy + rad * Math.sin(a)).toFixed(3)}`;
        const d = `M${pt(R, a0)} A${R} ${R} 0 ${big} 1 ${pt(R, a1)} L${pt(ri, a1)} A${ri} ${ri} 0 ${big} 0 ${pt(ri, a0)}Z`;

    </div>
    ${tot > 0 ? `<div class="pie-wrap">
      <div class="pie ${f ? 'focus' : ''}" id="pie"><svg viewBox="0 0 100 100" role="img" aria-label="${inc ? 'Ingresos' : 'Gastos'} por categoría, ${periodLabel(P)}">${svg.replace(new RegExp(`data-i="${P.focus}"`), `data-i="${P.focus}" class="on${cats.length === 1 ? ' sl' : ''}"`)}</svg><div class="ctr">${ctr}</div></div>

const catColor = id => { const c = catById(id); return `var(--c${(c && c.color) || 1})`; };

function dailyChart(list, r) {
  const days = []; for (let d = pd(r.from); ymd(d) <= r.to; d.setDate(d.getDate() + 1)) days.push(ymd(d));
  const tot = {}; list.forEach(m => { if (m.type === 'gasto') tot[m.date] = (tot[m.date] || 0) + (+m.amount || 0); });
  const max = Math.max(1, ...days.map(d => tot[d] || 0)), W = 600, H = 150, top = 18, bot = 22, n = days.length, bw = W / n, gap = Math.min(4, bw * .25), t = today();
  const avg = days.filter(d => d <= t).reduce((s, d) => s + (tot[d] || 0), 0) / Math.max(1, days.filter(d => d <= t).length);
  const y = v => H - bot - (v / max) * (H - top - bot);
  const bars = days.map((d, i) => { const v = tot[d] || 0, h = Math.max(v ? 3 : 0, (H - top - bot) - (y(v) - top)); const x = i * bw + gap / 2;
    return `<g data-d="${d}" data-v="${v}"><rect x="${i * bw}" y="${top}" width="${bw}" height="${H - top - bot}" fill="transparent"/>${v ? `<rect x="${x}" y="${H - bot - h}" width="${bw - gap}" height="${h}" rx="${Math.min(4, (bw - gap) / 2)}" fill="${d === t ? 'var(--accent)' : 'var(--c1)'}" opacity="${d > t ? .35 : 1}"/>` : ''}</g>`; }).join('');
  const lbls = days.map((d, i) => { const dd = pd(d); const show = n <= 7 || dd.getDate() === 1 || dd.getDate() % 5 === 0; return show ? `<text x="${i * bw + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--muted)">${n <= 7 ? DIAS[dd.getDay()] : dd.getDate()}</text>` : ''; }).join('');
  return `<div class="daily"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Gasto por día">
    <line x1="0" x2="${W}" y1="${H - bot}" y2="${H - bot}" stroke="var(--line)" stroke-width="1"/>
    ${avg > 0 ? `<line x1="0" x2="${W}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1"/>` : ''}
    ${bars}${lbls}</svg><div class="tip" hidden></div></div>
    <div class="s muted" style="font-size:12.5px;margin-top:6px">Línea punteada: promedio diario ${money(avg)} · máximo ${money(max === 1 && !Object.keys(tot).length ? 0 : max)}</div>`;
}

function viewAccounts() {
  const bal = balances(), accs = accounts();
  const card = a => {
    const b = bal[a.id] || 0; let body = '';
    if (a.type === 'credito') {
      const debt = Math.max(0, -b), lim = +a.limit || 0;
      body = `<div><div class="muted" style="font-size:12px">Deuda actual</div><span class="bal ${debt ? 'neg' : ''}">${money(debt)}</span></div>
        ${lim ? `<div style="display:grid;gap:6px"><div class="meter"><i style="width:${Math.min(100, debt / lim * 100)}%;${debt / lim > .7 ? 'background:var(--neg)' : ''}"></i></div></div>` : ''}
        <dl class="kv">${lim ? `<dt>Límite</dt><dd>${money(lim)}</dd><dt>Disponible</dt><dd>${money(lim - debt)}</dd>` : ''}
        ${+a.cutDay ? `<dt>Próximo corte</dt><dd>${shortDate(ymd(nextDayOf(+a.cutDay)))}</dd>` : ''}${+a.payDay ? `<dt>Fecha límite de pago</dt><dd>${shortDate(ymd(nextDayOf(+a.payDay)))}</dd>` : ''}</dl>`;
    } else if (earns(a)) {
      const y = yieldOf(a, b);
      body = `<div><div class="muted" style="font-size:12px">Saldo</div><span class="bal">${money(b)}</span></div>
        <dl class="kv"><dt>Tasa anual</dt><dd>${(+a.rate || 0).toFixed(2)}%${+a.cap ? ` hasta ${money(a.cap)}` : ''}</dd>${+a.cap ? `<dt>Tasa sobre excedente</dt><dd>${(+a.rateOver || 0).toFixed(2)}%</dd>` : ''}
        <dt>Bruto por día</dt><dd>${money(y.grossDay)}</dd>${+a.isr ? `<dt>Retención ISR por día</dt><dd>−${money(y.isrDay)}</dd>` : ''}
        <dt><b>Neto por día</b></dt><dd class="pos"><b>${money(y.netDay)}</b></dd><dt>Interés compuesto</dt><dd>${autoY(a) ? 'Se suma cada día' : 'Desactivado'}</dd><dt>Neto por mes (aprox.)</dt><dd>${money(y.netMonth)}</dd><dt>Neto por año</dt><dd>${money(y.netYear)}</dd></dl>`;
    } else body = `<div><div class="muted" style="font-size:12px">Saldo</div><span class="bal ${b < 0 ? 'neg' : ''}">${money(b)}</span></div>`;
    return `<div class="acard"><div class="top"><div style="display:flex;gap:10px;align-items:center;min-width:0"><span class="ico acc">${accIcon(a.type)}</span><div style="min-width:0"><div class="name">${esc(a.name)}</div><div class="muted" style="font-size:12.5px">${ACC_T[a.type]}</div></div></div></div>
      ${body}
      <div class="acts"><button class="btn sm" data-act="adjust" data-id="${a.id}">${earns(a) ? 'Actualizar saldo real' : 'Ajustar saldo'}</button>${a.type === 'credito' ? `<button class="btn sm" data-act="pay-card" data-id="${a.id}">Pagar tarjeta</button>` : ''}<button class="btn sm" data-act="edit-acc" data-id="${a.id}">Editar</button></div></div>`;
  };
  const catList = kind => categories(kind).map(c => `<button class="chip" data-act="edit-cat" data-id="${c.id}"><span class="dot" style="background:var(--c${c.color || 1})"></span>${esc(c.name)}</button>`).join('');
  return `
  <div class="ph"><div><h1>Cuentas</h1><div class="sub">Efectivo, tarjetas de débito y crédito, e inversiones</div></div><button class="btn pri" data-act="new-acc">${ICON.plus}Nueva cuenta</button></div>
  <div class="accs">${accs.map(card).join('')}</div>
  <div class="grid two" style="margin-top:24px">
    <section class="panel"><h2 class="sec">Categorías <button class="btn ghost sm" data-act="new-cat">${ICON.plus}Nueva</button></h2>
      <p class="muted" style="margin:0 0 12px;font-size:13px">Toca una categoría para renombrarla, cambiar su color o eliminarla. Los movimientos que ya la usan conservan su nombre.</p>
      <div class="fld"><div class="lab">Gastos</div><div class="chips">${catList('gasto')}</div></div>
      <div class="fld" style="margin-top:14px"><div class="lab">Ingresos</div><div class="chips">${catList('ingreso')}</div></div>
    </section>
    <section class="panel"><h2 class="sec">Respaldo</h2>
      <p style="margin:0 0 6px;color:var(--ink-2);font-size:14px">Tus datos viven solo en este dispositivo. Guarda un respaldo de vez en cuando (en Drive o tus archivos): es lo único que te protege si cambias o pierdes el celular.</p>
      <p class="muted" style="margin:0 0 12px;font-size:13px">${backupAgeText()}</p>
      <div class="acts"><button class="btn pri" data-act="export-json">Guardar respaldo</button><button class="btn" data-act="import">Importar respaldo</button><button class="btn" data-act="export">Exportar CSV</button></div>
      <p class="muted" style="margin:12px 0 0;font-size:12.5px">Importar reemplaza todo lo que hay en este dispositivo por el contenido del archivo. El CSV (${S.movs.length} movimientos) es para abrir en Excel o Google Sheets; no se puede importar.</p>
    </section>
  </div>`;
}

/* ---------- hojas (formularios) ---------- */
const finePointer = (() => { try { return matchMedia('(pointer: fine)').matches; } catch (e) { return true; } })();
function openSheet(s) { if (!S.sheet) S.prevY = window.scrollY; S.sheet = s; renderSheet(true); }
function closeSheet() {
  const wasPage = document.body.classList.contains('pagemode');
  S.sheet = null; $('#sheetRoot').innerHTML = ''; document.body.classList.remove('pagemode');
  if (wasPage && S.prevY != null) window.scrollTo(0, S.prevY);
}
const SHEETS = () => ({ mov: sheetMov, acc: sheetAcc, sub: sheetSub, cat: sheetCat, adjust: sheetAdjust, routine: sheetRoutine, yinfo: sheetYInfo });
function renderSheet(open) {
  const s = S.sheet, root = $('#sheetRoot');
  if (!s) { closeSheet(); return; }
  let sh = root.querySelector('.sheet');
  if (open || !sh) {
    const page = !finePointer;
    root.innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet enter" role="dialog" aria-modal="true">${SHEETS()[s.kind]()}</div></div>`;
    document.body.classList.toggle('pagemode', page);
    if (page) window.scrollTo(0, 0);
    sh = root.querySelector('.sheet');
    if (finePointer) { const f = sh.querySelector('[data-autofocus]'); if (f) setTimeout(() => f.focus(), 30); }
    return;
  }
  // Actualiza el contenido sin recrear la hoja: no se repite la animación ni se pierde el scroll o el foco.
  const sc = sh.scrollTop, wy = window.scrollY, act = document.activeElement, fid = act && sh.contains(act) ? act.id : null;
  const sel = fid && typeof act.selectionStart === 'number' ? [act.selectionStart, act.selectionEnd] : null;
  sh.innerHTML = SHEETS()[s.kind]();
  sh.scrollTop = sc; if (document.body.classList.contains('pagemode')) window.scrollTo(0, wy);
  if (fid) { const f = document.getElementById(fid); if (f) { f.focus({ preventScroll: true }); if (sel) try { f.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
}
// Selección de chips en su lugar, sin volver a dibujar la hoja.
function pickInPlace(el, multi) {
  const sh = el.closest('.sheet'); if (!sh) return renderSheet();
  if (multi) el.setAttribute('aria-pressed', el.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
  else sh.querySelectorAll(`[data-act="${el.dataset.act}"]`).forEach(b => b.setAttribute('aria-pressed', b === el ? 'true' : 'false'));
  sh.querySelector('.err')?.remove();
}

const chip = (on, act, id, label, dot) => `<button class="chip" data-act="${act}" data-id="${id}" aria-pressed="${!!on}">${dot ? `<span class="dot" style="background:${dot}"></span>` : ''}${esc(label)}</button>`;

async function saveMov() {
  const s = S.sheet, amt = parseAmt(s.amount);
  if (!(amt > 0)) return sheetErr('Escribe un monto mayor a cero.');
  if (!s.accountId) return sheetErr('Elige una cuenta.');
  if (s.type === 'transfer') { if (!s.toAccountId) return sheetErr('Elige la cuenta destino.'); if (s.toAccountId === s.accountId) return sheetErr('La cuenta destino debe ser distinta.'); }
  else if (!s.categoryId) return sheetErr('Elige una categoría.');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s.date || '')) return sheetErr('Elige una fecha válida.');
  const mov = { date: s.date, amount: r2(amt), type: s.type, accountId: s.accountId, note: (s.note || '').trim(), ts: Date.now() };
  if (s.type === 'transfer') mov.toAccountId = s.toAccountId; else mov.categoryId = s.categoryId;
  if (s.subId || s.keepSub) mov.subId = s.subId || s.keepSub;
  if (s.routineId || s.keepRoutine) mov.routineId = s.routineId || s.keepRoutine;
  const mk = s.date.slice(0, 7), id = s.editId || gen('m');
  const sub = s.subId ? S.cfg.subs[s.subId] : null;
  closeSheet();
  if (s.editId && s.editMk !== mk) await writeMov(s.editMk, id, null);
  const ok = await writeMov(mk, id, mov);
  if (!ok) return;
  store.set('mc-last-acc', s.accountId);
  if (sub && !s.editId) {
    const paid = (+sub.paid || 0) + 1, done = sub.kind === 'meses' && +sub.total && paid >= +sub.total;
    await writeCfg({ subs: { [s.subId]: { lastPaid: s.dueMonth, paid, active: !done } } });
    toast(done ? `¡${sub.name} liquidado!` : 'Pago registrado');
  } else toast(s.editId ? 'Movimiento actualizado' : s.type === 'gasto' ? 'Gasto guardado' : s.type === 'ingreso' ? 'Ingreso guardado' : 'Transferencia guardada');
}
async function saveAcc() {
  const s = S.sheet, name = (s.name || '').trim();
  if (!name) return sheetErr('Ponle nombre a la cuenta.');
  const init = s.initial === '' || s.initial == null ? 0 : parseAmt(s.initial);
  if (isNaN(init)) return sheetErr('El saldo no es un número válido.');
  const acc = { name, type: s.type, initial: s.type === 'credito' ? -Math.abs(init) : init };
  const numOr = (v, def = 0) => { const n = parseAmt(v); return isNaN(n) ? def : n; };
  const day = v => { const n = Math.round(numOr(v)); return n >= 1 && n <= 31 ? n : 0; };
  if (s.type === 'credito') Object.assign(acc, { limit: numOr(s.limit), cutDay: day(s.cutDay), payDay: day(s.payDay) });
  if (s.type === 'debito') acc.earns = !!s.earns;
  if (s.type === 'inversion' || (s.type === 'debito' && s.earns)) { const rate = numOr(s.rate, NaN); if (isNaN(rate)) return sheetErr('Escribe la tasa anual de rendimiento.'); Object.assign(acc, { rate, isr: numOr(s.isr), cap: numOr(s.cap), rateOver: numOr(s.rateOver), autoYield: s.autoYield !== false });
    const prev = s.editId ? accById(s.editId) : null;
    if (acc.autoYield && (!prev || !autoY(prev))) acc.yieldStart = today();
  }
  const id = s.editId || gen('a');
  if (!s.editId) { acc.order = accounts().length; acc.created = today(); }
  closeSheet();
  if (await writeCfg({ accounts: { [id]: acc } })) toast(s.editId ? 'Cuenta actualizada' : 'Cuenta agregada');
}
async function saveSub() {
  const s = S.sheet, name = (s.name || '').trim(), amt = parseAmt(s.amount), day = Math.round(parseAmt(s.day));
  if (!name) return sheetErr('Ponle nombre.');
  if (!(amt > 0)) return sheetErr('Escribe el monto mensual.');
  if (!(day >= 1 && day <= 31)) return sheetErr('El día de cobro va de 1 a 31.');
  if (!s.accountId) return sheetErr('Elige la cuenta donde se cobra.');
  if (!s.categoryId) return sheetErr('Elige una categoría.');
  const sub = { name, amount: r2(amt), day, accountId: s.accountId, categoryId: s.categoryId, kind: s.subKind };
  if (s.subKind === 'meses') {
    const total = Math.round(parseAmt(s.total)), paid = Math.max(0, Math.round(parseAmt(s.paid) || 0));
    if (!(total >= 1)) return sheetErr('Escribe el número de pagos.');
    if (paid > total) return sheetErr('Los pagos hechos no pueden ser más que el total.');
    Object.assign(sub, { total, paid });
    if (paid >= total) sub.active = false;
  }
  if (s.editId) { if (sub.active !== false) sub.active = s.active !== false; }
  else { sub.active = sub.active !== false; sub.lastPaid = s.paidNow ? curMonth() : addMonths(curMonth(), -1); sub.created = today(); }
  const id = s.editId || gen('s');
  closeSheet();
  if (await writeCfg({ subs: { [id]: sub } })) toast(s.editId ? 'Mensualidad actualizada' : 'Mensualidad agregada');
}

async function saveAdjust() {

/* ---------- eventos ---------- */
/* Toques en celular: la acción se ejecuta al levantar el dedo sobre el mismo botón que se tocó,
   aunque la pantalla se haya movido (teclado que se cierra, etc.). El "click" que el navegador
   manda después se ignora para no repetir la acción. Mouse y teclado siguen usando "click". */
let lastPT = 'mouse', lastPTat = 0, ptr = null;
const TAP_SLOP = 12;
document.addEventListener('pointerdown', e => {
  lastPT = e.pointerType || 'mouse'; lastPTat = Date.now();
  if (lastPT === 'mouse') { ptr = null; return; }
  const el = e.target.closest && e.target.closest('[data-act],[data-tab]');
  ptr = el && !el.disabled ? { el, target: e.target, x: e.clientX, y: e.clientY, id: e.pointerId } : null;
}, true);
document.addEventListener('pointermove', e => { if (ptr && e.pointerId === ptr.id && Math.hypot(e.clientX - ptr.x, e.clientY - ptr.y) > TAP_SLOP) ptr = null; }, true);
document.addEventListener('pointercancel', () => { ptr = null; }, true);
document.addEventListener('pointerup', e => {
  if (!ptr || e.pointerId !== ptr.id) return;
  const p = ptr; ptr = null; lastPTat = Date.now();
  if (!document.contains(p.el) || p.el.disabled) return;
  onAct({ target: p.target });
}, true);
document.addEventListener('click', e => {
  if (lastPT !== 'mouse' && e.detail !== 0 && Date.now() - lastPTat < 1500) return;
  onAct(e);
});
function kpPress(v) {
  const s = S.sheet; if (!s) return;
  let a = String(s.amount || '');
  if (v === 'del') a = a.slice(0, -1);
  else if (v === '.') { if (!a.includes('.')) a = (a || '0') + '.'; }
  else {
    if (a.includes('.') && a.split('.')[1].length >= 2) return;
    if (a.replace('.', '').length >= 9) return;
    a = a === '0' ? v : a + v;
  }
  s.amount = a; s.err = null;
  const o = document.getElementById('amt-d');
  if (o) { o.textContent = a || '0'; o.classList.toggle('ph', !a); }
  document.querySelector('.sheet .err')?.remove();
}
function syncSheetInputs() {
  if (!S.sheet) return;
  document.querySelectorAll('.sheet [data-f]').forEach(i => { S.sheet[i.dataset.f] = i.type === 'checkbox' ? i.checked : i.value; });
}
function onAct(e) {
  const tb = e.target.closest('[data-tab]');
  if (tb) { S.tab = tb.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id, s = S.sheet;
  if (act === 'scrim') { if (e.target === el && !document.body.classList.contains('pagemode')) closeSheet(); return; }
  if (/^save-|^newcat-save$|^del$/.test(act)) syncSheetInputs();
  switch (act) {
    case 'setup': setup(el); break;
    case 'new-mov': newMov(); break;
    case 'edit-mov': { const m = S.months[el.dataset.mk]?.[id]; if (!m) return; if (m.auto === 'yield') { openSheet({ kind: 'yinfo', m }); break; } openSheet({ kind: 'mov', editId: id, editMk: el.dataset.mk, type: m.type === 'ajuste' ? 'gasto' : m.type, amount: String(Math.abs(m.amount)), accountId: m.accountId, toAccountId: m.toAccountId || null, categoryId: m.categoryId || null, date: m.date, note: m.note || '', wasAjuste: m.type === 'ajuste', signed: m.amount, keepSub: m.subId || null, keepRoutine: m.routineId || null }); break; }
    case 'mtype': s.type = el.dataset.v; if (s.categoryId && catById(s.categoryId)?.kind !== (s.type === 'ingreso' ? 'ingreso' : 'gasto')) s.categoryId = null; s.err = null; renderSheet(); break;
    case 'pick-acc': s.accountId = id; s.err = null; pickInPlace(el); break;
    case 'pick-to': s.toAccountId = id; s.err = null; pickInPlace(el); break;
    case 'pick-cat': s.categoryId = id; s.err = null; pickInPlace(el); break;
    case 'newcat-inline': s.newCat = true; s.newCatName = ''; renderSheet(); setTimeout(() => $('#f-newcat')?.focus(), 20); break;
    case 'newcat-cancel': s.newCat = false; renderSheet(); break;
    case 'newcat-save': {
      const name = (s.newCatName || '').trim(); if (!name) return;
      const kind = s.type === 'ingreso' ? 'ingreso' : 'gasto', cid = gen('c'), n = categories(kind).length;
      s.newCat = false; s.categoryId = cid;
      S.cfg.categories = { ...S.cfg.categories, [cid]: { name, kind, color: (n % 8) + 1, order: 100 + categories().length } };
      writeCfg({ categories: { [cid]: S.cfg.categories[cid] } }); renderSheet(); break;
    }
    case 'save-mov': saveMov(); break;
    case 'del': delCurrent(); break;
    case 'close': closeSheet(); break;
    case 'mode': S.per = { mode: el.dataset.mode, anchor: S.per.anchor }; render(); break;
    case 'prev': S.per = shiftPeriod(S.per, -1); render(); break;
    case 'next': S.per = shiftPeriod(S.per, 1); render(); break;
    case 'new-acc': openSheet({ kind: 'acc', type: 'debito', name: '', initial: '', isr: '0.9' }); break;
    case 'edit-acc': { const a = accById(id); openSheet({ kind: 'acc', editId: id, type: a.type, name: a.name, initial: a.type === 'credito' ? String(Math.abs(a.initial || 0)) : String(a.initial ?? 0), limit: a.limit || '', cutDay: a.cutDay || '', payDay: a.payDay || '', earns: !!a.earns, autoYield: a.autoYield !== false, rate: a.rate ?? '', isr: a.isr ?? '', cap: a.cap || '', rateOver: a.rateOver || '' }); break; }
    case 'acc-type': s.type = id; if (id === 'inversion' && (s.isr === '' || s.isr == null)) s.isr = '0.9'; renderSheet(); break;
    case 'save-acc': saveAcc(); break;
    case 'adjust': { const a = accById(id); openSheet({ kind: 'adjust', accId: id, real: '', asYield: earns(a) && !autoY(a) }); break; }
    case 'save-adjust': saveAdjust(); break;
    case 'pay-card': { const bal = balances()[id] || 0; const from = accounts().find(a => a.type === 'debito'); newMov({ type: 'transfer', toAccountId: id, accountId: from?.id || lastAcc(), amount: bal < 0 ? String(r2(-bal)) : '', note: 'Pago de tarjeta' }); break; }
    case 'new-sub': openSheet({ kind: 'sub', subKind: 'fijo', name: '', amount: '', day: '', accountId: lastAcc(), categoryId: categories('gasto').find(c => c.id === 'c-suscripciones')?.id || null, paidNow: false }); break;
    case 'edit-sub': { const x = S.cfg.subs[id]; openSheet({ kind: 'sub', editId: id, subKind: x.kind || 'fijo', name: x.name, amount: String(x.amount), day: String(x.day), total: x.total ?? '', paid: x.paid ?? '', accountId: x.accountId, categoryId: x.categoryId, active: x.active }); break; }
    case 'sub-kind': s.subKind = el.dataset.v; if (s.subKind === 'meses' && !s.editId) s.categoryId = s.categoryId || null; renderSheet(); break;
    case 'save-sub': saveSub(); break;
    case 'pay-sub': { const x = S.cfg.subs[id], d = subDue(x); const isM = x.kind === 'meses'; newMov({ type: 'gasto', amount: String(x.amount), accountId: accById(x.accountId) && !accById(x.accountId).deleted ? x.accountId : lastAcc(), categoryId: x.categoryId, note: isM ? `${x.name} (${(+x.paid || 0) + 1}/${x.total})` : x.name, subId: id, dueMonth: d.dueMonth }); break; }
    case 'new-cat': openSheet({ kind: 'cat', name: '', catKind: 'gasto', color: (categories('gasto').length % 8) + 1 }); break;
    case 'edit-cat': { const c = catById(id); openSheet({ kind: 'cat', editId: id, name: c.name, catKind: c.kind, color: c.color || 1 }); break; }
    case 'cat-kind': s.catKind = el.dataset.v; renderSheet(); break;
    case 'cat-color': s.color = +el.dataset.v; pickInPlace(el); break;
    case 'save-cat': saveCat(); break;
    case 'export': exportCsv(); break;
    case 'export-json': exportBackup(); break;
    case 'import': pickBackup(); break;
    case 'kp': kpPress(el.dataset.v); break;
    case 'show-note': s.showNote = true; renderSheet(); setTimeout(() => document.getElementById('f-note')?.focus(), 30); break;
    case 'pie-kind': S.pie = { ...S.pie, kind: el.dataset.v, focus: null }; store.set('mc-pie', JSON.stringify({ kind: S.pie.kind, mode: S.pie.mode })); render(); break;
    case 'pie-mode': S.pie = { ...S.pie, mode: el.dataset.v, anchor: today(), focus: null }; store.set('mc-pie', JSON.stringify({ kind: S.pie.kind, mode: S.pie.mode })); render(); break;
    case 'pie-prev': S.pie = { ...shiftPeriod(S.pie, -1), focus: null }; render(); break;
    case 'pie-next': S.pie = { ...shiftPeriod(S.pie, 1), focus: null }; render(); break;
    case 'pie-focus': { const i = +el.dataset.i; S.pie.focus = S.pie.focus === i ? null : i; render(); break; }
    case 'go-routines': S.tab = 'subs'; render(); setTimeout(() => document.getElementById('rutinas')?.scrollIntoView(), 30); break;
    case 'new-routine': openSheet({ kind: 'routine', rType: 'gasto', name: '', amount: '', times: '1', days: [], accountId: lastAcc(), categoryId: null }); break;
    case 'edit-routine': { const r = S.cfg.routines[id]; openSheet({ kind: 'routine', editId: id, rType: r.type, name: r.name, amount: String(r.amount), times: String(r.times || 1), days: [...(r.days || [])], accountId: r.accountId, categoryId: r.categoryId, active: r.active }); break; }
    case 'r-type': s.rType = el.dataset.v; if (s.categoryId && catById(s.categoryId)?.kind !== s.rType) s.categoryId = null; renderSheet(); break;
    case 'r-day': { const d = +el.dataset.v; s.days = s.days.includes(d) ? s.days.filter(x => x !== d) : [...s.days, d]; s.err = null; pickInPlace(el, true); break; }
    case 'save-routine': saveRoutine(); break;
    case 'rc-dec': case 'rc-inc': { const r = S.cfg.routines[id], k = id + '|' + el.dataset.d, c = S.rcount[k] ?? (+r.times || 1); S.rcount[k] = Math.max(1, Math.min(20, c + (act === 'rc-inc' ? 1 : -1))); render(); break; }
    case 'r-log': logRoutine(el); break;
    case 'r-skip': skipRoutine(el); break;
    case 'use-routine': { const r = S.cfg.routines[id]; Object.assign(s, { routineId: id, type: r.type, amount: String(r.amount), accountId: accById(r.accountId) && !accById(r.accountId).deleted ? r.accountId : s.accountId, categoryId: r.categoryId, note: r.name, err: null }); renderSheet(); break; }
  }
}
document.addEventListener('input', e => {
  const f = e.target.dataset?.f; if (!f || !S.sheet) return;
  S.sheet[f] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  if (f === 'real') { const d = $('#adj-diff'); if (d) { const a = accById(S.sheet.accId), cur = balances()[S.sheet.accId] || 0, real = parseAmt(e.target.value); if (isNaN(real)) d.innerHTML = ''; else { const diff = r2((a.type === 'credito' ? -Math.abs(real) : real) - cur); d.innerHTML = `Diferencia: <b class="num ${diff < 0 ? 'neg' : 'pos'}">${diff < 0 ? '−' : '+'}${money(Math.abs(diff))}</b>`; } } }
});

  const f = e.target.dataset?.f; if (f && S.sheet && e.target.type === 'checkbox') { S.sheet[f] = e.target.checked; if (f === 'earns') { if (S.sheet.earns && (S.sheet.isr === '' || S.sheet.isr == null)) S.sheet.isr = '0.9'; renderSheet(); } }
});

  if (e.key === 'Escape' && S.sheet) closeSheet();

    if (e.target.id === 'f-newcat') { e.preventDefault(); document.querySelector('[data-act="newcat-save"]')?.click(); return; }

    const btn = document.querySelector('.sheet .foot .btn.pri'); if (btn) { e.preventDefault(); btn.click(); }
  }
});


/* ---------- almacenamiento local (IndexedDB) ----------
   Imita la interfaz que usaba la versión de Claude: doc(id).update(patch) mezcla en profundidad,
   doc(id).set(data) reemplaza, onSnapshot avisa en cada cambio. Todo se guarda en este dispositivo. */
const LocalDB = (() => {
  const NAME = 'mi-cartera', STORE = 'docs';
  let idb = null, listener = null;
  const docs = {};
  const err = (code, message) => Object.assign(new Error(message), { code });
  const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
  const merge = (t, p) => { for (const [k, v] of Object.entries(p)) { if (isObj(v) && isObj(t[k])) merge(t[k], v); else t[k] = v === undefined ? t[k] : JSON.parse(JSON.stringify(v)); } return t; };
  const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const tx = (fn) => new Promise((res, rej) => {
    const t = idb.transaction(STORE, 'readwrite'); fn(t.objectStore(STORE));
    t.oncomplete = () => res(); t.onerror = () => rej(t.error || err('io', 'Error al guardar')); t.onabort = () => rej(t.error || err('io', 'Guardado cancelado'));
  });
  const emit = () => { if (!listener) return; const snap = { docs: Object.keys(docs).map(id => ({ id, data: () => JSON.parse(JSON.stringify(docs[id])) })), metadata: { fromCache: false } }; queueMicrotask(() => listener(snap)); };
  const api = {
    async open() {
      if (!window.indexedDB) throw err('nodb', 'Sin IndexedDB');
      try {
        const r = indexedDB.open(NAME, 1);
        r.onupgradeneeded = () => r.result.createObjectStore(STORE);
        idb = await req(r);
      } catch (e) { throw err('nodb', String(e && e.message || e)); }
      const t = idb.transaction(STORE, 'readonly').objectStore(STORE);
      const [keys, vals] = await Promise.all([req(t.getAllKeys()), req(t.getAll())]);
      keys.forEach((k, i) => docs[k] = vals[i]);
      return api;
    },
    onSnapshot(fn) { listener = fn; emit(); },
    doc(id) {
      return {
        async update(patch) {
          if (!(id in docs)) throw err('invalid_argument', 'El documento no existe');
          const next = merge(JSON.parse(JSON.stringify(docs[id])), patch);
          await tx(s => s.put(next, id)); docs[id] = next; emit();
        },
        async set(data) {
          const next = JSON.parse(JSON.stringify(data));
          await tx(s => s.put(next, id)); docs[id] = next; emit();
        },
      };
    },
    dump() { return JSON.parse(JSON.stringify(docs)); },
    async replaceAll(all) {
      await tx(s => { s.clear(); for (const [k, v] of Object.entries(all)) s.put(v, k); });
      for (const k of Object.keys(docs)) delete docs[k];
      Object.assign(docs, JSON.parse(JSON.stringify(all))); emit();
    },
  };
  return api;
})();

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
async function saveFile(name, text, mime) {
  const blob = new Blob([text], { type: mime });
  // En iPhone la app instalada no descarga archivos: se usa el menú Compartir (Guardar en Archivos, Drive…).
  if (isIOS && navigator.canShare) {
    const file = new File([blob], name, { type: mime });
    if (navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name }); return true; }
      catch (e) { if (e && e.name === 'AbortError') return false; }
    }
  }
  try {
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Archivo guardado en Descargas');
    return true;
  } catch (e) { toast('No se pudo guardar el archivo.'); return false; }
}
function backupAgeText() {
  const last = store.get('mc-last-backup');
  if (!last) return 'Aún no has guardado ningún respaldo en este dispositivo.';
  const d = diffDays(new Date(), pd(last));
  return d <= 0 ? 'Último respaldo: hoy.' : d === 1 ? 'Último respaldo: ayer.' : `Último respaldo: hace ${d} días.`;
}
async function exportBackup() {
  const data = { app: 'mi-cartera', format: 1, exported: new Date().toISOString(), docs: LocalDB.dump() };
  if (await saveFile(`respaldo-mi-cartera-${today()}.json`, JSON.stringify(data), 'application/json')) { store.set('mc-last-backup', today()); render(); }
}
function pickBackup() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    let data;
    try { data = JSON.parse(await f.text()); } catch (e) { toast('El archivo no es un respaldo válido.'); return; }
    const docs = data && data.app === 'mi-cartera' && data.docs;
    if (!docs || !docs.config || !docs.config.accounts) { toast('El archivo no es un respaldo de Mi Cartera.'); return; }
    const nMov = Object.entries(docs).filter(([k]) => k.startsWith('m-')).reduce((n, [, v]) => n + Object.values((v && v.items) || {}).filter(Boolean).length, 0);
    const when = data.exported ? ` del ${shortDate(ymd(new Date(data.exported)))}` : '';
    if (S.status === 'ready' && !confirm(`¿Reemplazar todos los datos de este dispositivo por el respaldo${when} (${nMov} movimientos)? Esto no se puede deshacer.`)) return;
    try { await LocalDB.replaceAll(docs); S.tab = 'inicio'; toast(`Respaldo importado: ${nMov} movimientos`); }
    catch (e) { toast('No se pudo importar: ' + (e && e.message || 'error')); }
  };
  inp.click();
}
/* ---------- arranque ---------- */
// Tras cerrarse el teclado del celular, algunos navegadores dejan los toques desfasados dentro del visor.
// Un pequeño movimiento de scroll obliga a recalcular posiciones.
(() => {
  let t; const nudge = () => { clearTimeout(t); t = setTimeout(() => { const y = window.scrollY; window.scrollTo(0, y + 1); requestAnimationFrame(() => window.scrollTo(0, y)); }, 300); };
  try { window.visualViewport && window.visualViewport.addEventListener('resize', nudge); } catch (e) {}
  document.addEventListener('focusout', e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) nudge();
    setTimeout(() => { const a = document.activeElement; if (!a || !isTextField(a)) document.body.classList.remove('kbd'); }, 250);
  });
  const isTextField = el => el.matches && el.matches('input:not([type=checkbox]):not([type=date]):not([type=radio]), textarea');
  // Antes de que aparezca el teclado, sube el campo a la parte alta de la pantalla.
  document.addEventListener('focusin', e => {
    if (finePointer || !document.body.classList.contains('pagemode') || !isTextField(e.target)) return;
    document.body.classList.add('kbd');
    const top = window.scrollY + e.target.getBoundingClientRect().top - 16;
    window.scrollTo(0, Math.max(0, top));
  });
})();
try { const pp = JSON.parse(store.get('mc-pie') || 'null'); if (pp && ['gasto', 'ingreso'].includes(pp.kind) && ['dia', 'semana', 'mes', 'año'].includes(pp.mode)) Object.assign(S.pie, pp); } catch (e) {}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (S.status === 'ready') render(); accrue(); } });
(async () => {
  render();
  try { col = await LocalDB.open(); }
  catch (e) { S.status = e && e.code === 'nodb' ? 'nodb' : 'error'; S.err = e; render(); return; }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  col.onSnapshot(snap => {
    let cfg = null; const months = {};
    snap.docs.forEach(d => { if (d.id === 'config') cfg = d.data(); else if (d.id.startsWith('m-')) months[d.id.slice(2)] = (d.data() || {}).items || {}; });
    S.cfg = cfg ? JSON.parse(JSON.stringify(cfg)) : null; S.months = months; rebuild();
    S.status = cfg ? 'ready' : 'empty';
    render();
    if (S.status === 'ready') setTimeout(accrue, 400);
  });
})();
})();
